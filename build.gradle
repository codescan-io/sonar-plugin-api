plugins {
  id 'com.github.hierynomus.license' version '0.16.1'
  id 'com.github.johnrengelman.shadow' version '7.1.2' apply false
  id 'org.sonarqube' version '3.3'
}

ext {
  codeartifactReleaseUrl = 'https://autorabit-artifacts-domain-261140574810.d.codeartifact.us-east-1.amazonaws.com/maven/autorabit-libs-release/'
  codeartifactSnapshotUrl = 'https://autorabit-artifacts-domain-261140574810.d.codeartifact.us-east-1.amazonaws.com/maven/autorabit-libs-snapshot/'
}

def codeartifactRepositoryUrl(project) {
  def configuredUrl = System.getenv('CODEARTIFACT_REPOSITORY_URL')
  if (configuredUrl) {
    return configuredUrl
  }
  return project.version.toString().endsWith('SNAPSHOT') ? codeartifactSnapshotUrl : codeartifactReleaseUrl
}

def codeartifactAuthToken() {
  System.getenv('CODEARTIFACT_AUTH_TOKEN') ?: ''
}

allprojects {
  apply plugin: 'maven-publish'

  ext {
    release = project.hasProperty('release') && project.getProperty('release')
    buildNumber = System.getProperty("buildNumber")
  }
  // Replaces the version defined in sources, usually x.y-SNAPSHOT, by a version identifying the build.
  if (version.endsWith('-SNAPSHOT') && ext.buildNumber != null) {
    def versionSuffix = (version.toString().count('.') == 1 ? ".0.${ext.buildNumber}" : ".${ext.buildNumber}")
    version = version.replace('-SNAPSHOT', versionSuffix)
  }

  repositories {
    def repository = project.hasProperty('qa') ? 'sonarsource-qa' : 'sonarsource'
    mavenCentral()
    maven {
      url codeartifactRepositoryUrl(project)
      credentials {
        username = 'aws'
        password = codeartifactAuthToken()
      }
    }
    maven {
      url "https://repox.jfrog.io/repox/${repository}"
      def repoxUsername = System.env.'ARTIFACTORY_PRIVATE_USERNAME' ?: (project.hasProperty('artifactoryUsername') ? project.getProperty('artifactoryUsername') : '')
      def repoxPassword = System.env.'ARTIFACTORY_PRIVATE_PASSWORD' ?: (project.hasProperty('artifactoryPassword') ? project.getProperty('artifactoryPassword') : '')
      if (repoxUsername && repoxPassword) {
        credentials {
          username = repoxUsername
          password = repoxPassword
        }
      }
    }
  }
}

sonarqube {
  properties {
    property 'sonar.buildString', version
  }
}

subprojects {
  apply plugin: 'com.github.hierynomus.license'
  apply plugin: 'jacoco'
  apply plugin: 'java-library'
  apply plugin: 'maven-publish'

  ext.publishToCodeArtifact = true

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(17)
    }
  }

  jacoco {
    toolVersion = "0.8.7"
  }

  jacocoTestReport {
    reports {
      xml.required = true
      csv.required = false
      html.required = false
    }
  }

  license {
    header = rootProject.file('HEADER')
    strictCheck true
    encoding = 'UTF-8'
    mapping {
      java = 'SLASHSTAR_STYLE'
      js = 'SLASHSTAR_STYLE'
      ts = 'SLASHSTAR_STYLE'
      tsx = 'SLASHSTAR_STYLE'
      css = 'SLASHSTAR_STYLE'
    }
    includes(['**/*.java', '**/*.js', '**/*.ts', '**/*.tsx', '**/*.css'])
  }

  tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
  }

  task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
  }

  task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
  }

  publishing {
    repositories {
      maven {
        name = 'codeartifact'
        url = uri(codeartifactRepositoryUrl(project))
        credentials {
          username = 'aws'
          password = providers.environmentVariable('CODEARTIFACT_AUTH_TOKEN').orElse('')
        }
      }
    }
  }

  tasks.withType(PublishToMavenRepository).configureEach {
    onlyIf { project.ext.publishToCodeArtifact }
    doFirst {
      if (!codeartifactAuthToken()) {
        throw new GradleException(
          'CODEARTIFACT_AUTH_TOKEN is not set. Export a CodeArtifact token before running publish.'
        )
      }
    }
  }

  rootProject.tasks["sonarqube"].dependsOn jacocoTestReport

  apply plugin: 'signing'

  signing {
    def signingKeyId = findProperty("signingKeyId")
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    required {
      def branch = System.getenv()["CIRRUS_BRANCH"]
      def publishingToCodeArtifact = gradle.taskGraph.allTasks.any { it.name == 'publish' }
      return (branch == 'master' || branch ==~ 'branch-[\\d.]+') && publishingToCodeArtifact
    }
    sign publishing.publications
  }

  tasks.withType(Sign) {
    onlyIf {
      def branch = System.getenv()["CIRRUS_BRANCH"]
      def publishingToCodeArtifact = gradle.taskGraph.allTasks.any { it.name == 'publish' }
      return project.ext.publishToCodeArtifact &&
              (branch == 'master' || branch ==~ 'branch-[\\d.]+') &&
              publishingToCodeArtifact
    }
  }
}
