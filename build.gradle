plugins {
  id 'com.github.hierynomus.license' version '0.16.1'
  id 'com.github.johnrengelman.shadow' version '7.1.2' apply false
  id 'org.sonarqube' version '3.3'
}

allprojects {
  apply plugin: 'maven-publish'

  // AWS CodeArtifact (migrated off artifactory.autorabit.com). The auth token is provided by
  // CODEARTIFACT_AUTH_TOKEN (OIDC in CI, `aws sso` locally via scripts/codeartifact-bootstrap.sh).
  ext.codeartifactUrl = System.getenv('CODEARTIFACT_MAVEN_URL') ?:
    'https://autorabit-artifacts-domain-261140574810.d.codeartifact.us-east-1.amazonaws.com/maven/autorabit-libs-release/'
  ext.codeartifactToken = System.getenv('CODEARTIFACT_AUTH_TOKEN') ?:
    (project.hasProperty('codeartifactToken') ? project.getProperty('codeartifactToken') : '')
  // Opt-in publishing flag (replaces the former `artifactoryPublish.skip`).
  ext.publishToCodeArtifact = false

  ext {
    release = project.hasProperty('release') && project.getProperty('release')
    buildNumber = System.getProperty("buildNumber")
  }
  // Replaces the version defined in sources, usually x.y-SNAPSHOT, by a version identifying the build.
  if (version.endsWith('-SNAPSHOT') && ext.buildNumber != null) {
    def versionSuffix = (version.toString().count('.') == 1 ? ".0.${ext.buildNumber}" : ".${ext.buildNumber}")
    version = version.replace('-SNAPSHOT', versionSuffix)
  }

  repositories {
    def repository = project.hasProperty('qa') ? 'sonarsource-qa' : 'sonarsource'
    mavenCentral()
    maven {
      url "https://repox.jfrog.io/repox/${repository}"
      // The environment variables ARTIFACTORY_PRIVATE_USERNAME and ARTIFACTORY_PRIVATE_PASSWORD are used on QA env (Jenkins)
      // On local box, please add artifactoryUsername and artifactoryPassword to ~/.gradle/gradle.properties
      def artifactoryUsername = System.env.'ARTIFACTORY_USER' ?: (project.hasProperty('artifactoryUsername') ? project.getProperty('artifactoryUsername') : '')
      def artifactoryPassword = System.env.'ARTIFACTORY_PWD' ?: (project.hasProperty('artifactoryPassword') ? project.getProperty('artifactoryPassword') : '')
      if (artifactoryUsername && artifactoryPassword) {
        credentials {
          username = artifactoryUsername
          password = artifactoryPassword
        }
      }
    }
  }

  // `./gradlew artifactPublish` publishes the Maven artifacts to AWS CodeArtifact.
  // Replaces the former com.jfrog.artifactory `artifactoryPublish` task; the publish
  // repository is configured in the subprojects `publishing {}` block below.
  tasks.register('artifactPublish') {
    dependsOn 'publish'
  }
}

sonarqube {
  properties {
    property 'sonar.buildString', version
  }
}

subprojects {
  apply plugin: 'com.github.hierynomus.license'
  apply plugin: 'jacoco'
  apply plugin: 'java-library'
  apply plugin: 'maven-publish'

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(17)
    }
  }

  // Publish opted-in modules to AWS CodeArtifact (replaces com.jfrog.artifactory).
  tasks.withType(PublishToMavenRepository).configureEach {
    onlyIf { project.publishToCodeArtifact }
  }

  publishing {
    repositories {
      maven {
        name = 'codeartifact'
        url = codeartifactUrl
        credentials {
          username = 'aws'
          password = codeartifactToken
        }
      }
    }
  }

  jacoco {
    toolVersion = "0.8.7"
  }

  jacocoTestReport {
    reports {
      xml.required = true
      csv.required = false
      html.required = false
    }
  }

  license {
    header = rootProject.file('HEADER')
    strictCheck true
    encoding = 'UTF-8'
    mapping {
      java = 'SLASHSTAR_STYLE'
      js = 'SLASHSTAR_STYLE'
      ts = 'SLASHSTAR_STYLE'
      tsx = 'SLASHSTAR_STYLE'
      css = 'SLASHSTAR_STYLE'
    }
    includes(['**/*.java', '**/*.js', '**/*.ts', '**/*.tsx', '**/*.css'])
  }

  tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
  }

  task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
  }

  task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
  }

  rootProject.tasks["sonarqube"].dependsOn jacocoTestReport

  apply plugin: 'signing'

  signing {
    def signingKeyId = findProperty("signingKeyId")
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    required {
      def branch = System.getenv()["CIRRUS_BRANCH"]
      return (branch == 'master' || branch ==~ 'branch-[\\d.]+') &&
              gradle.taskGraph.hasTask(":artifactPublish")
    }
    sign publishing.publications
  }

  tasks.withType(Sign) {
    onlyIf {
      def branch = System.getenv()["CIRRUS_BRANCH"]
      return project.publishToCodeArtifact &&
              (branch == 'master' || branch ==~ 'branch-[\\d.]+') &&
              gradle.taskGraph.hasTask(":artifactPublish")
    }
  }
}

